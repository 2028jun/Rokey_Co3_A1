# Fixed rails: aisle spine forward into table; leave by reverse to aisle.
# Arm front-mounted (+X). Approach facing table: T0/T2 yaw=pi, T1/T3 yaw=0.
# Return spines stay on x=0 through the kitchen doorway (y≈5.0) then kitchen.
frame_id: map

kitchen: {x: 0.21, y: 5.25, yaw: -1.5708}

routes:
  # ---- outbound: spine -> dock (all forward) ----
  to_0:
    spine:
      - {x: 0.00, y: 4.20, yaw: -1.5708}
      - {x: 0.00, y: 2.50, yaw: -1.5708}
      - {x: 0.00, y: 0.50, yaw: -1.5708}
      - {x: 0.00, y: -2.20, yaw: -1.5708}
    pre_dock: {x: 0.00, y: -2.20, yaw: 3.1416}
    dock: {x: -1.82, y: -2.20, yaw: 3.1416}

  to_1:
    spine:
      - {x: 0.00, y: 4.20, yaw: -1.5708}
      - {x: 0.00, y: 2.50, yaw: -1.5708}
      - {x: 0.00, y: 0.50, yaw: -1.5708}
      - {x: 0.00, y: -2.20, yaw: -1.5708}
    pre_dock: {x: 0.00, y: -2.20, yaw: 0.0}
    dock: {x: 1.82, y: -2.20, yaw: 0.0}

  to_2:
    spine:
      - {x: 0.00, y: 4.20, yaw: -1.5708}
      - {x: 0.00, y: 2.50, yaw: -1.5708}
      - {x: 0.00, y: 0.70, yaw: -1.5708}
    pre_dock: {x: 0.00, y: 0.70, yaw: 3.1416}
    dock: {x: -1.82, y: 0.70, yaw: 3.1416}

  to_3:
    spine:
      - {x: 0.00, y: 4.20, yaw: -1.5708}
      - {x: 0.00, y: 2.50, yaw: -1.5708}
      - {x: 0.00, y: 0.70, yaw: -1.5708}
    pre_dock: {x: 0.00, y: 0.70, yaw: 0.0}
    dock: {x: 1.82, y: 0.70, yaw: 0.0}

  to_4:
    spine:
      - {x: 0.00, y: 3.00, yaw: 1.5708}
      - {x: 0.00, y: 4.50, yaw: 1.5708}
      - {x: 0.00, y: 5.00, yaw: 1.5708}
    pre_dock: {x: 0.21, y: 5.25, yaw: -1.5708}
    dock: {x: 0.21, y: 5.25, yaw: -1.5708}

  # ---- return: reverse to aisle -> x=0 rail -> doorway -> kitchen ----
  from_0:
    spine:
      - {x: 0.00, y: 0.50, yaw: 1.5708}
      - {x: 0.00, y: 2.50, yaw: 1.5708}
      - {x: 0.00, y: 4.20, yaw: 1.5708}
      - {x: 0.00, y: 5.00, yaw: 1.5708}
    pre_dock: {x: 0.00, y: -2.20, yaw: 3.1416}
    dock: {x: 0.21, y: 5.25, yaw: -1.5708}

  from_1:
    spine:
      - {x: 0.00, y: 0.50, yaw: 1.5708}
      - {x: 0.00, y: 2.50, yaw: 1.5708}
      - {x: 0.00, y: 4.20, yaw: 1.5708}
      - {x: 0.00, y: 5.00, yaw: 1.5708}
    pre_dock: {x: 0.00, y: -2.20, yaw: 0.0}
    dock: {x: 0.21, y: 5.25, yaw: -1.5708}

  from_2:
    spine:
      - {x: 0.00, y: 2.50, yaw: 1.5708}
      - {x: 0.00, y: 4.20, yaw: 1.5708}
      - {x: 0.00, y: 5.00, yaw: 1.5708}
    pre_dock: {x: 0.00, y: 0.70, yaw: 3.1416}
    dock: {x: 0.21, y: 5.25, yaw: -1.5708}

  from_3:
    spine:
      - {x: 0.00, y: 2.50, yaw: 1.5708}
      - {x: 0.00, y: 4.20, yaw: 1.5708}
      - {x: 0.00, y: 5.00, yaw: 1.5708}
    pre_dock: {x: 0.00, y: 0.70, yaw: 0.0}
    dock: {x: 0.21, y: 5.25, yaw: -1.5708}
