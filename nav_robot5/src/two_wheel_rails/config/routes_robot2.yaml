# Fixed rails (map frame). Nav2 follows these poses; rail_mission checks cross-track error.
# Dock x=±1.72 follows the reference restaurant rail layout.
frame_id: map

kitchen: {x: 0.90, y: 4.90, yaw: -1.5707963267948966}
spawn: {x: 0.90, y: 5.25, yaw: -1.5707963267948966}

routes:
  to_0:
    spine:
      - {x: 0.00, y: 5.00, yaw: -1.5708}
      - {x: 0.00, y: 4.20, yaw: -1.5708}
      - {x: 0.00, y: 2.50, yaw: -1.5708}
      - {x: 0.00, y: 0.50, yaw: -1.5708}
      - {x: 0.00, y: -2.20, yaw: -1.5708}
