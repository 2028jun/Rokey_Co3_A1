# Nav2 free-path planning and rotate/drive-only execution with orthogonal A* and L-path.
sample_spacing_m: 0.05
maximum_cost: 70

# Orthogonal A*
turn_penalty: 8.0
obstacle_cost_weight: 3.0
corner_replan_attempts: 3

# Corner Rotation Check
rotation_clearance_radius_m: 0.45

# Docking
dock_approach_distance_m: 0.60
dock_step_distance_m: 0.15
dock_max_linear_speed_mps: 0.10
dock_min_linear_speed_mps: 0.04
dock_xy_tolerance_m: 0.07
dock_yaw_tolerance_rad: 0.0523598776      # 3 deg
dock_realign_threshold_rad: 0.1047197551   # 6 deg

# Motion Control
rotate_done_rad: 0.0698131701       # 4 deg
rotate_reenter_rad: 0.1745329252    # 10 deg
final_yaw_tolerance_rad: 0.0698131701
waypoint_tolerance_m: 0.12
max_linear_speed_mps: 0.22
min_linear_speed_mps: 0.07
max_angular_speed_rps: 0.50
rotate_gain: 1.25
drive_timeout_base_sec: 15.0
drive_timeout_per_meter_sec: 12.0
replan_cte_m: 0.35
replan_attempts: 2
log_period_sec: 1.0
