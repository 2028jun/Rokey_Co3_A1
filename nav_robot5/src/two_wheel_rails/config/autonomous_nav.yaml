# Nav2 free-path planning and rotate/drive-only execution with orthogonal A* and L-path.
sample_spacing_m: 0.05
maximum_cost: 70

# Orthogonal A*
turn_penalty: 8.0
obstacle_cost_weight: 3.0
corner_replan_attempts: 3

# Corner Rotation Check
rotation_clearance_radius_m: 0.45

# Docking
dock_approach_distance_m: 0.60
dock_step_distance_m: 0.08
dock_max_linear_speed_mps: 0.10
dock_min_linear_speed_mps: 0.02
dock_xy_tolerance_m: 0.04
dock_yaw_tolerance_rad: 0.034906585       # 2 deg
dock_realign_threshold_rad: 0.1047197551   # 6 deg
dock_yaw_gain: 1.0
dock_max_angular_speed_rps: 0.04
dock_min_angular_speed_rps: 0.04
dock_rotate_min_angular_speed_rps: 0.08
dock_yaw_deadband_rad: 0.0034906585       # 0.2 deg

# Motion Control
rotate_done_rad: 0.034906585        # 2 deg
rotate_reenter_rad: 0.0872664626    # 5 deg
final_yaw_tolerance_rad: 0.034906585
axis_tolerance_m: 0.03
final_approach_axis_tolerance_m: 0.03
axis_braking_decel_mps2: 0.30
axis_speed_gain: 0.8
axis_min_linear_speed_mps: 0.015
axis_crawl_distance_m: 0.12
axis_slowdown_distance_m: 0.30
axis_crawl_max_speed_mps: 0.025
axis_slow_max_speed_mps: 0.08
axis_yaw_gain: 1.6
axis_max_yaw_correction_rps: 0.28
max_linear_speed_mps: 0.22
min_linear_speed_mps: 0.07
max_angular_speed_rps: 0.50
rotate_min_angular_speed_rps: 0.18
min_angular_speed_rps: 0.06
rotate_gain: 1.25
straight_yaw_gain: 1.2
straight_max_angular_speed_rps: 0.08
straight_yaw_deadband_rad: 0.0052359878   # 0.3 deg
drive_timeout_base_sec: 15.0
drive_timeout_per_meter_sec: 12.0
replan_cte_m: 0.15
replan_attempts: 2
log_period_sec: 1.0
