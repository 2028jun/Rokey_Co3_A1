hand_detector_node:
  ros__parameters:
    input_topic: /camera/color/image_raw
    output_image_topic: /hand_detection/image
    detections_topic: /hand_detection/detections
    roi_intrusion_topic: /hand_safety/intrusion
    table_arrived_topic: /serving_robot/table_arrived
    # Reject lower-confidence robot-link false positives.
    confidence: 0.70
    iou: 0.7
    # Preserve enough pixels for the relatively small rendered hand.
    image_size: 1280
    # Use one inference crop instead of competing with Isaac Sim for the GPU.
    tiled_inference: false
    tile_overlap: 0.15
    # Crop one padded tabletop ROI before inference. This enlarges the hand
    # while excluding most of the robot arm, without adding another GPU pass.
    roi_inference: true
    roi_inference_padding: 0.05
    device: "0"
    half: false
    process_rate: 30.0
    confirmation_frames: 5
    # Simulator-first dynamic mask for the robot's dark, neutral material.
    self_mask_enabled: true
    self_mask_value_max: 90
    self_mask_saturation_max: 130
    self_mask_min_box_overlap: 0.20
    # Large debug images and OpenCV HighGUI can make the process appear hung.
    publish_annotated_image: false
    show_window: false
