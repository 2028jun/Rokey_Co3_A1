hand_detector_node:
  ros__parameters:
    input_topic: /serving_robot/table_camera/color/image_raw
    output_image_topic: /hand_detection/image
    detections_topic: /hand_detection/detections
    roi_intrusion_topic: /hand_safety/roi_intrusion
    model_path: src/hand_safety/models/YOLOv10n_hands.pt
    confidence: 0.55
    iou: 0.7
    # Preserve small, distant hand details during YOLO preprocessing.
    image_size: 1280
    tiled_inference: true
    tile_overlap: 0.15
    device: "0"
    process_rate: 30.0
    confirmation_frames: 3
    show_window: true
