slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames (match Isaac two-wheel + two_wheel_rails topic_bridge)
    odom_frame: odom
    map_frame: map
    base_frame: ridgeback_base_link
    scan_topic: /scan

    mode: mapping  # online async mapping

    resolution: 0.05
    map_update_interval: 1.0

    # Match Isaac two_wheel lidar (~12 m)
    max_laser_range: 12.0
    min_laser_range: 0.15
    transform_timeout: 0.5
    # Denser pose graph updates while driving slowly
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08

    transform_publish_period: 0.05
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    use_response_expansion: true

    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_search_maximum_distance: 4.0

    throttle_scans: 1
    debug_logging: false
