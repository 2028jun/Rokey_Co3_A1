<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIZZA BOT - 주문하기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/kiosk.css?v=1">
</head>
<body class="kiosk-body">
    <div class="kiosk-app">
        <!-- Top Brand Bar -->
        <header class="kiosk-topbar">
            <div class="kiosk-brand">
                <span class="kiosk-brand-emoji">🍕</span>
                <span class="kiosk-brand-name">PIZZA BOT</span>
            </div>
            <div class="kiosk-topbar-hint">화면을 터치해서 주문해 주세요</div>
        </header>

        <div class="kiosk-body-grid">
            <!-- Main: Category Tabs + Item Grid -->
            <div class="kiosk-main">
                <nav class="kiosk-cat-tabs">
                    <button class="cat-tab active" id="cat-tab-pizza" onclick="switchCategory('pizza')">
                        <i class="fa-solid fa-pizza-slice"></i> 메뉴
                    </button>
                    <button class="cat-tab" id="cat-tab-extra" onclick="switchCategory('extra')">
                        <i class="fa-solid fa-utensils"></i> 추가 주문
                    </button>
                    <button class="cat-tab" id="cat-tab-table" onclick="switchCategory('table')">
                        <i class="fa-solid fa-chair"></i> 테이블 선택
                    </button>
                </nav>

                <!-- Pizza / Drink Menu -->
                <section class="cat-panel active" id="cat-panel-pizza">
                    <div class="kiosk-item-grid">
                        <div class="item-card" id="menu-card-m1" role="button" tabindex="0" onclick="quickAdd('m1', '페퍼로니', 18000)">
                            <div class="item-badge">🍕</div>
                            <div class="item-info">
                                <span class="item-name">페퍼로니</span>
                                <span class="item-price">18,000원</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m1', '페퍼로니', 18000, -1)">−</button>
                                <span class="qty-count" id="qty-m1">0</span>
                                <button class="qty-btn" onclick="updateCart('m1', '페퍼로니', 18000, 1)">+</button>
                            </div>
                        </div>

                        <div class="item-card" id="menu-card-m2" role="button" tabindex="0" onclick="quickAdd('m2', '마르게리따', 17000)">
                            <div class="item-badge">🧀</div>
                            <div class="item-info">
                                <span class="item-name">마르게리따</span>
                                <span class="item-price">17,000원</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m2', '마르게리따', 17000, -1)">−</button>
                                <span class="qty-count" id="qty-m2">0</span>
                                <button class="qty-btn" onclick="updateCart('m2', '마르게리따', 17000, 1)">+</button>
                            </div>
                        </div>

                        <div class="item-card" id="menu-card-m3" role="button" tabindex="0" onclick="quickAdd('m3', '콤비네이션', 20000)">
                            <div class="item-badge">🍕</div>
                            <div class="item-info">
                                <span class="item-name">콤비네이션</span>
                                <span class="item-price">20,000원</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m3', '콤비네이션', 20000, -1)">−</button>
                                <span class="qty-count" id="qty-m3">0</span>
                                <button class="qty-btn" onclick="updateCart('m3', '콤비네이션', 20000, 1)">+</button>
                            </div>
                        </div>

                        <div class="item-card" id="menu-card-m4" role="button" tabindex="0" onclick="quickAdd('m4', '콜라 / 음료', 3000)">
                            <div class="item-badge">🥤</div>
                            <div class="item-info">
                                <span class="item-name">콜라 / 음료</span>
                                <span class="item-price">3,000원</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m4', '콜라 / 음료', 3000, -1)">−</button>
                                <span class="qty-count" id="qty-m4">0</span>
                                <button class="qty-btn" onclick="updateCart('m4', '콜라 / 음료', 3000, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Extra / Cutlery -->
                <section class="cat-panel" id="cat-panel-extra">
                    <div class="kiosk-item-grid">
                        <div class="item-card" id="menu-card-m5" role="button" tabindex="0" onclick="quickAdd('m5', '식기도구 (수저통)', 0)">
                            <div class="item-badge">🍴</div>
                            <div class="item-info">
                                <span class="item-name">식기도구 (수저통)</span>
                                <span class="item-price">무료</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m5', '식기도구 (수저통)', 0, -1)">−</button>
                                <span class="qty-count" id="qty-m5">0</span>
                                <button class="qty-btn" onclick="updateCart('m5', '식기도구 (수저통)', 0, 1)">+</button>
                            </div>
                        </div>
                        <div class="item-card" id="menu-card-m6" role="button" tabindex="0" onclick="quickAdd('m6', '접시', 0)">
                            <div class="item-badge">🍽️</div>
                            <div class="item-info">
                                <span class="item-name">접시</span>
                                <span class="item-price">무료</span>
                            </div>
                            <div class="item-qty-controls" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="updateCart('m6', '접시', 0, -1)">−</button>
                                <span class="qty-count" id="qty-m6">0</span>
                                <button class="qty-btn" onclick="updateCart('m6', '접시', 0, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Table Selection -->
                <section class="cat-panel" id="cat-panel-table">
                    <p class="kiosk-table-hint">지금 앉아 계신 테이블 번호를 선택해 주세요</p>
                    <div class="kiosk-table-grid">
                        <button class="table-card selected" id="table-card-1" onclick="selectTable(1)">
                            <i class="fa-solid fa-chair"></i>
                            <span>Table 1</span>
                        </button>
                        <button class="table-card" id="table-card-2" onclick="selectTable(2)">
                            <i class="fa-solid fa-chair"></i>
                            <span>Table 2</span>
                        </button>
                        <button class="table-card" id="table-card-3" onclick="selectTable(3)">
                            <i class="fa-solid fa-chair"></i>
                            <span>Table 3</span>
                        </button>
                        <button class="table-card" id="table-card-4" onclick="selectTable(4)">
                            <i class="fa-solid fa-chair"></i>
                            <span>Table 4</span>
                        </button>
                    </div>
                </section>
            </div>

            <!-- Persistent Cart Sidebar -->
            <aside class="kiosk-cart">
                <div class="kiosk-cart-header">
                    <i class="fa-solid fa-cart-shopping"></i> 주문 내역
                    <span class="kiosk-cart-table-chip">Table <strong id="summary-table-num">1</strong></span>
                </div>

                <div class="kiosk-cart-items" id="cart-items-list">
                    <div class="cart-empty-state">
                        <i class="fa-solid fa-pizza-slice"></i>
                        <p>메뉴를 선택해 주세요</p>
                    </div>
                </div>

                <div class="kiosk-cart-footer">
                    <div class="kiosk-cart-total-row">
                        <span>총 결제 금액</span>
                        <strong id="summary-total-price">0원</strong>
                    </div>
                    <button class="kiosk-submit-btn" id="submit-order-btn" onclick="submitOrder()" disabled>
                        <i class="fa-solid fa-robot"></i> 로봇 서빙 주문하기
                    </button>
                </div>
            </aside>
        </div>

        <a class="kiosk-admin-link" href="/admin" target="_blank" rel="noopener">
            <i class="fa-solid fa-gauge-high"></i>
        </a>
    </div>

    <!-- Order Confirmation Overlay -->
    <div class="kiosk-overlay" id="kiosk-confirm-overlay">
        <div class="kiosk-confirm-card">
            <div class="kiosk-confirm-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h2>주문이 접수되었어요!</h2>
            <p id="kiosk-confirm-detail">Table 1으로 로봇이 곧 서빙을 시작합니다.</p>
        </div>
    </div>

    <!-- Toast Notifications (replaces alert()) -->
    <div class="kiosk-toast" id="kiosk-toast"></div>

    <script src="/js/kiosk.js?v=1"></script>
</body>
</html>
